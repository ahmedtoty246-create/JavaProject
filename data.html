<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search and Sort Table</title>
    <script src="app2.js" defer></script>
</head>
<body>

    <h2>People Directory</h2>

    
    <input type="text" id="searchInput" placeholder="Search by name or city...">
    <br><br>

  
    <button id="sortNameBtn">Sort by Name</button>
    <button id="sortAgeBtn">Sort by Age</button>
    <br><br>

    
    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>
