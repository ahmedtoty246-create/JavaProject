<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name = "viewport" content="width=device-width , initial-scale = 1.0">
        <title> registration Form</title>
        <script src="app1.js" defer></script>
    </head>
    <body>
        <form id = "rform">
            <label for="name"> Name : </label>
            <input id= "name" type="text" name="username" placeholder="Type your username">
            <p id="nameError"></p>
            <hr>
            <br>
             <label for="email"> Email : </label>
            <input id="email" type="email" name="Email" placeholder="Type your mail">
            <p id="emailError"></p>
            <hr>
            <br>
             <label for="pass"> Password : </label>
            <input id="pass" type="password" name="Password" placeholder="Type your Password ">
            <p id="passwordError"></p>
            <hr>
            <br>
             <label for="Cpass"> Confirm Password : </label>
            <input id="Cpass" type="text" name="username" placeholder="Confirm your password ">
            <p id="confirmPasswordError"></p>
            <hr>
            <br>
             <label for="age"> Age : </label>
            <input id="age" type="number" name="Age" placeholder="Type your Age">
            <p id="ageError"></p>
            <br>
            <br>
            <button type="submit"> Register</button>
            <p id="successMsgError"></p>
        </form>
    </body>
</html>
